<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mahot descelliers · dither</title>
    <meta
      name="description"
      content="Image dithering playground in the browser."
    />
    <link rel="icon" href="../favicon.ico" />
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <nav class="theme">
      <label><input type="radio" name="theme" value="dark" />dark</label>
      <label><input type="radio" name="theme" value="light" />light</label>
    </nav>
    <script src="../theme.js"></script>
    <script src="../terminal.js" defer></script>
    <p><a href="../">← back</a></p>

    <main>
      <h1>dither</h1>
      <p>
        Upload an image or use your webcam.<br>
        Works in the browser only.
      </p>

      <form class="dither">
        <p>
          <label class="button"><input type="file" accept="image/*" />open image</label>
          <button type="button" class="button" id="webcam">webcam</button>
        </p>
        <p>
          <label class="choice"><input type="radio" name="algorithm" value="bayer" checked />bayer</label>
          <label class="choice"
            ><input type="radio" name="algorithm" value="floyd-steinberg" />floyd-steinberg</label
          >
          <label class="choice"><input type="radio" name="algorithm" value="atkinson" />atkinson</label>
        </p>
        <p>
          <label>pixel size <input type="range" name="pixel" min="1" max="8" value="2" /></label>
          <label
            >threshold <input type="range" name="threshold" min="0" max="1" step="0.01" value="0.5"
          /></label>
        </p>
        <canvas></canvas>
        <p>
          <button type="button" class="button" id="save">save</button>
        </p>
        <p class="status" role="status"></p>
      </form>
    </main>
    <script type="module" src="dither.js"></script>
  </body>
</html>
